name: Build SF_SlimeHUD

on:
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release after all required exact-source candidate checks pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Paper 1.21.11 baseline
            java: 21
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: false
          - label: Paper 1.21.11 on Java 25
            java: 25
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: true
          - label: Paper 26.1.2 stable API
            java: 25
            paper: 26.1.2.build.74-stable
            artifact: false
          - label: Paper 26.2 stable API
            java: 25
            paper: 26.2.build.124-stable
            artifact: false
          - label: Paper 26.3 stable API
            java: 25
            paper: 26.3.build.203-stable
            artifact: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build against ${{ matrix.paper }}
        run: mvn -B -ntp -Dpaper.version="${{ matrix.paper }}" clean package

      - name: Verify drop-in filename
        run: test -s target/SF_SlimeHUD2.0.6.jar

      - name: Upload raw JAR
        if: matrix.artifact && !(github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeHUD2.0.6.jar
          path: target/SF_SlimeHUD2.0.6.jar
          archive: false
          if-no-files-found: error

  release-runtime-gates:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/runtime-compatibility.yml

  publish:
    name: Publish a new verified version
    needs: [build, release-runtime-gates]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: slimehud-release
      cancel-in-progress: false
    steps:
      - name: Checkout the verified source
        uses: actions/checkout@v6

      - name: Download the exact runtime-tested JAR
        uses: actions/download-artifact@v8
        with:
          name: SF_SlimeHUD2.0.6.jar
          path: build/verified-release

      - name: Require current master and a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          for path in ('/git/ref/tags/v2.0.6', '/releases/tags/v2.0.6'):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'User-Agent': 'SF_SlimeHUD-release'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              raise SystemExit('Refusing to overwrite an existing tag or release: ' + path)
          PY

      - name: Create the new tag and release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/verified-release -name 'SF_SlimeHUD2.0.6.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          # Creating the ref fails if another publisher created the tag after preflight.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v2.0.6' -f sha="$GITHUB_SHA" >/dev/null
          gh release create 'v2.0.6' "$JAR" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'SF_SlimeHUD 2.0.6' --notes-file docs/releases/2.0.6.md
