name: PR Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Paper 1.21.11 baseline
            java: 21
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: false
          - label: Paper 1.21.11 on Java 25
            java: 25
            paper: 1.21.11-R0.1-SNAPSHOT
            artifact: true
          - label: Paper 26.1.2 stable API
            java: 25
            paper: 26.1.2.build.74-stable
            artifact: false
          - label: Paper 26.2 stable API
            java: 25
            paper: 26.2.build.124-stable
            artifact: false
          - label: Paper 26.3 stable API
            java: 25
            paper: 26.3.build.203-stable
            artifact: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
        - name: Install checksum-verified Apache Maven 3.10.0
          run: bash scripts/install_maven_3_10.sh

      - name: Build against ${{ matrix.paper }}
        run: mvn -B -ntp -Dpaper.version="${{ matrix.paper }}" clean package

      - name: Verify drop-in filename
        run: test -s target/SF_SlimeHUD2.0.7.jar

      - name: Upload raw JAR
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_SlimeHUD2.0.7.jar
          path: target/SF_SlimeHUD2.0.7.jar
          archive: false
          if-no-files-found: error
