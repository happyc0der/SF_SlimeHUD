name: SlimeHUD
version: ${project.version}
main: io.github.schntgaispock.slimehud.SlimeHUD
api-version: '1.21'
folia-supported: true
authors:
  - SchnTgaiSpock
  - wickidcow
description: Native Slimefun Legacy + vanilla block HUD with optional crouch-only display.
website: https://github.com/wickidcow/SF_SlimeHUD

depend:
  - Slimefun

softdepend:
  - PlaceholderAPI

commands:
  slimehud:
    description: Configure the SlimeHUD WAILA display
    aliases: [sfhud, sfh]
    usage: /slimehud [toggle|display <bossbar|actionbar>|status|reload]

permissions:
  slimehud.togglewaila:
    description: Toggle the SlimeHUD display
    default: true
  slimehud.display:
    description: Choose BossBar or ActionBar display
    default: true
  slimehud.reload:
    description: Reload SlimeHUD configuration
    default: op
