name: Publish verified SlimeHUD 2.0.7 (one-shot)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v2.0.7-once.yml'

permissions:
  contents: read

concurrency:
  group: slimehud-release
  cancel-in-progress: false

jobs:
  verify-runtime:
    name: Re-run exact-source runtime matrix
    uses: ./.github/workflows/runtime-compatibility.yml
    permissions:
      contents: read

  publish:
    needs: verify-runtime
    name: Publish raw 2.0.7 JAR after green runtime checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Require exact reviewed change on current master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=70ff41a9116174270d1749a47dcea30e81993c70
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          test "$CHANGED" = '.github/workflows/publish-v2.0.7-once.yml'
          grep -Eq '<version>2\.0\.7</version>' pom.xml
          test -f docs/releases/2.0.7.md
          if gh release view v2.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.0.7 release already exists; refusing to overwrite' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.7" >/dev/null 2>&1; then
            echo 'v2.0.7 tag already exists; refusing to move it' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build source-matched drop-in JAR and verify packaged defaults
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp clean package
          JAR=target/SF_SlimeHUD2.0.7.jar
          test -s "$JAR"
          echo '0faa208bc991852e4e23ea839247141cf719363dc49dc3056bac8cee071e05a7  target/SF_SlimeHUD2.0.7.jar' | sha256sum -c
          unzip -p "$JAR" plugin.yml | grep -Eq '^version: 2\.0\.7$'
          unzip -p "$JAR" config.yml | grep -Eq '^  disabled: false$'
          unzip -p "$JAR" config.yml | grep -Eq '^  default-enabled: false$'
          unzip -p "$JAR" config.yml | grep -Eq '^  crouch-only: true$'
          if unzip -Z1 "$JAR" | grep -q 'WITIntegration.class'; then
            echo 'Unexpected WIT bridge in native SlimeHUD' >&2
            exit 1
          fi
          if unzip -p "$JAR" plugin.yml | grep -Eq '^[[:space:]]*-[[:space:]]*WIT$'; then
            echo 'Unexpected WIT soft dependency' >&2
            exit 1
          fi
          echo "Verified raw v2.0.7 JAR sha256: $(sha256sum "$JAR" | cut -d ' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create new tag and release without modifying past versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release view v2.0.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release appeared during build; refusing to overwrite' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v2.0.7' -f sha="$GITHUB_SHA" >/dev/null
          gh release create v2.0.7 target/SF_SlimeHUD2.0.7.jar \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'SF_SlimeHUD 2.0.7' --notes-file docs/releases/2.0.7.md
          EXPECTED='sha256:0faa208bc991852e4e23ea839247141cf719363dc49dc3056bac8cee071e05a7'
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.0.7" \
            --jq '.assets[] | select(.name == "SF_SlimeHUD2.0.7.jar") | .digest')"
          test "$ACTUAL" = "$EXPECTED"
          echo 'SF_SlimeHUD v2.0.7 published with correct defaults.' >> "$GITHUB_STEP_SUMMARY"
