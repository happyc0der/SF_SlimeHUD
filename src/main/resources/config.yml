options:
  placeholder-api-support: true

waila:
  # Disable the HUD globally.
  disabled: false

  # Opt-in HUD: a player without a saved preference starts with the HUD off.
  # /slimehud toggle lets players turn it on or off and persists their choice.
  # Do NOT set waila.disabled: true here, as it prevents opt-in entirely.
  default-enabled: false

  # Only show information while a player holds Shift.
  # This affects display visibility, not their saved on/off preference.
  crouch-only: true

  # Worlds where the HUD is disabled.
  disabled-in: []

  # Default per-player display. Players can override with /slimehud display.
  # Valid values: bossbar, actionbar
  default-display: bossbar

  # Legacy compatibility: old configs used bossbar/hotbar here.
  location: bossbar

  # How far players can inspect blocks and dropped items using the native HUD.
  max-distance: 8

  # Update interval in ticks.
  tick-rate: 5

  # Keep Slimefun/vanilla color codes in the HUD.
  use-original-colors: true

  # Bossbar color: red, yellow, green, blue, purple, pink, white, default, inherit
  bossbar-color: inherit

  # Slimefun Legacy machine information.
  show-cargo-size: true
  show-cargo-channel: true
  show-energy-size: true
  show-energy-stored: true
  show-machine-progress: true
  show-generator-generation: true

items:
  # Looking directly at a dropped item can identify vanilla and registered
  # Slimefun item stacks. This uses the same ray trace as block targeting.
  enabled: true
  show-stack-size: true

  # Useful for admins/debugging, but kept off for normal players by default.
  show-slimefun-id: false

vanilla:
  # Generic vanilla block support is automatic; new Materials do not need to be
  # added to a list. The switches below control extra state details.
  enabled: true
  show-redstone: true
  show-crop-age: true
  show-beehive: true
  show-smelting: true
  show-brewing: true
  show-container-items: true
  show-beacon-effects: true
  show-spawner-type: true
  show-note-block: true
  show-farmland: true

  # Show a compact preferred-tool marker beside vanilla block names.
  # Slimefun blocks do not receive these markers, except RepairedSpawner.
  # Vanilla and repaired spawners show Pickaxe of Containment. Addon spawner
  # machines remain excluded, matching Slimefun's actual containment rules.
  show-tool-symbol: true
  tool-symbols:
    pickaxe: "⛏"
    axe: "🪓"
    shovel: "🪏"
    hoe: "⚒"
    containment: "⛏"

  # Keep the detailed tool/tier line, for example "Tool: Pickaxe (Diamond+)".
  show-tool: true
  show-waterlogged: false
  show-open-state: false
  show-lit-state: false
